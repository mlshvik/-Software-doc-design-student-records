server:
  port: 8080

spring:
  application:
    name: student-records
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:student_records}
    username: ${POSTGRES_USER:student_records}
    password: ${POSTGRES_PASSWORD:student_records}
  jpa:
    hibernate:
      ddl-auto: validate   # схемою керує Flyway
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-change-me-dev-secret-key-change-me}
    expiration-minutes: 480
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
