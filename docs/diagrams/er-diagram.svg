<rect width="2220" height="1075" fill="white"/>
<text x="1110.0" y="34" text-anchor="middle" font-size="24" font-weight="bold" fill="#263238">ER-діаграма бази даних (PostgreSQL)</text>
<text x="40" y="1050" font-size="13.5">Позначення: PK – первинний ключ, FK – зовнішній ключ, UQ – унікальність. Зв'язки в нотації «вороняча лапка» (crow's foot): ⟨ – «багато», || – «рівно один», o| – «нуль або один».</text>
