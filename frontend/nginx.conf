server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # REST API і документація Swagger – на бекенд Spring Boot
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
    }

    # Статичні ресурси з хешем у назві кешуються надовго
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Клієнтська маршрутизація: будь-який інший шлях віддає index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
